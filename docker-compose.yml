services:
  app:
    build:
      context: .
      network: host
    container_name: ytb-dl
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - DOWNLOAD_DIR=/data/downloads
      - TTL_MINUTES=60
      - MAX_CONCURRENT=3
      # Cookies + proxy for YouTube are configured in the web UI (Settings),
      # persisted to /data. They are needed because YouTube blocks non-residential
      # IPs with a bot-detection wall. Env vars below are optional fallbacks:
      # - YTDLP_PROXY=http://host.docker.internal:7890
      # - YTDLP_IMPERSONATE=chrome
    volumes:
      - ./data:/data
    restart: unless-stopped
