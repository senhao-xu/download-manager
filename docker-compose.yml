services:
  app:
    # Local build. To switch back to the CI-published image:
    #   image: ghcr.io/senhao-xu/download-manager:latest
    #   pull_policy: always
    build: .
    container_name: download-manager
    ports:
      - "9000:8000"
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - DOWNLOAD_DIR=/data/downloads
      - TTL_MINUTES=60
      - MAX_CONCURRENT=3
      # Cookies + proxy for YouTube are configured inline in the YouTube tab,
      # persisted to /data. They are needed because YouTube blocks non-residential
      # IPs with a bot-detection wall. Env vars below are optional fallbacks:
      # - YTDLP_PROXY=http://host.docker.internal:7890
      # - YTDLP_IMPERSONATE=chrome
    volumes:
      - ./data:/data
    restart: unless-stopped
